name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  threads:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install x86 emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86
      - name: Run thread tests
        shell: bash
        run: |
          source pintos/activate
          make -C pintos/threads check

  user-programs:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install x86 emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86
      - name: Run user-program tests
        shell: bash
        run: |
          source pintos/activate
          make -C pintos/userprog check

  virtual-memory:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install x86 emulator
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-x86
      - name: Run virtual-memory tests
        shell: bash
        run: |
          source pintos/activate
          make -C pintos/vm check

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
